<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (() => {
        document.documentElement.dataset.js = "true";
        try {
          const storedTheme = localStorage.getItem("theme");
          if (storedTheme === "light" || storedTheme === "dark") {
            document.documentElement.dataset.theme = storedTheme;
            document.documentElement.dataset.themeMode = storedTheme;
          } else {
            delete document.documentElement.dataset.theme;
            document.documentElement.dataset.themeMode = "system";
          }
        } catch {
          // Keep the system theme when storage is unavailable.
        }
      })();
    </script>
    <meta name="theme-color" content="#007aff" media="(prefers-color-scheme: light)" data-theme-color="light">
    <meta name="theme-color" content="#0a84ff" media="(prefers-color-scheme: dark)" data-theme-color="dark">
    <script>
      (() => {
        const root = document.documentElement;
        const syncThemeColors = () => {
          const theme = root.dataset.theme;
          document.querySelectorAll('meta[name="theme-color"][data-theme-color]').forEach((meta) => {
            meta.media = theme
              ? meta.dataset.themeColor === theme
                ? "all"
                : "not all"
              : `(prefers-color-scheme: ${meta.dataset.themeColor})`;
          });
        };
        syncThemeColors();
        new MutationObserver(syncThemeColors).observe(root, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
      })();
    </script>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/page.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="/shared/site-shell.js" defer></script>
    {% include head-custom.html %}
    <script>
      customElements.whenDefined("shen-site-header").then(() => {
        const header = document.querySelector("shen-site-header");
        const frame = header?.shadowRoot?.querySelector("[src]");
        const ready = () => {
          if (frame.contentDocument?.URL === "about:blank") return;
          frame.removeEventListener("load", ready);
          const release = () => {
            if (frame.offsetHeight !== header.offsetHeight) {
              requestAnimationFrame(release);
              return;
            }
            header.classList.add("site-header-ready");
          };
          requestAnimationFrame(release);
        };
        frame?.addEventListener("load", ready);
      });

      window.addEventListener("pageshow", async (event) => {
        if (!event.persisted) return;
        await Promise.all(
          ["shen-site-header", "shen-site-footer"].map((name) => customElements.whenDefined(name)),
        );
        document.querySelectorAll("shen-site-header, shen-site-footer").forEach((shell) => {
          const frame = shell.shadowRoot?.querySelector("[src]");
          if (frame) frame.src = frame.src;
        });
      });
    </script>
  </head>
  <body>
    <shen-site-header></shen-site-header>

    <main class="container-lg px-3 my-4 markdown-body" id="content">
      <div class="repo-actions">
        <a class="repo-button" href="{{ site.url }}/project/">&larr; Back to Project</a>
        <a class="repo-button repo-button-primary" href="{{ site.repository_url }}" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
      </div>
      {{ content }}
    </main>
    <shen-site-footer></shen-site-footer>
  </body>
</html>
