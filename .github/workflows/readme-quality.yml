name: README palettes

on:
  pull_request:
    paths:
      - "README.md"
      - "figures/**"
      - "auto/**"
      - ".github/workflows/readme-quality.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "README.md"
      - "figures/**"
      - "auto/**"
      - ".github/workflows/readme-quality.yml"
  workflow_dispatch:

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate palette strips in the check workspace
        run: node auto/generate-palettes.mjs
      - name: Validate the generated README and assets
        run: node auto/validate-readme.mjs

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate palette strips and remove obsolete assets
        run: node auto/generate-palettes.mjs
      - name: Validate the generated README and assets
        run: node auto/validate-readme.mjs
      - name: Commit generated palette changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- README.md auto/palettes)" ]; then
            echo "Palette assets are already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md auto/palettes
          git commit -m "chore: sync generated palettes [skip ci]"
          git push
