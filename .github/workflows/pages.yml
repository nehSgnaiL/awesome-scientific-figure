name: Deploy repository page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &page_paths
      - "README.md"
      - "figures/**"
      - "auto/palettes/**"
      - ".github/pages/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths: *page_paths

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: repository-page
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'nehSgnaiL/awesome-scientific-figure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated Pages source
        run: node .github/pages/build-source.mjs

      - name: Validate page integration
        run: node .github/pages/validate.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.github/pages/.build/source
          destination: ./.github/pages/.build/site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.github/pages/.build/site

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'nehSgnaiL/awesome-scientific-figure'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
