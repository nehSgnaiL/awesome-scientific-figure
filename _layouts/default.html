<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    {% seo %}
    <link rel="stylesheet" href="{{ '/auto/page.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="/shared/site-shell.js" defer></script>
    {% include head-custom.html %}
  </head>
  <body>
    <shen-site-header></shen-site-header>

    <main class="container-lg px-3 my-4 markdown-body" id="content">
      <div class="repo-actions">
        <a class="repo-button" href="{{ site.url }}/project/">&larr; Back to Project</a>
        <a class="repo-button repo-button-primary" href="{{ site.repository_url }}">GitHub Repository</a>
      </div>
      {{ content }}
    </main>
    <shen-site-footer></shen-site-footer>
  </body>
</html>
